name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ponto
          POSTGRES_PASSWORD: ponto
          POSTGRES_DB: ponto_test
          TZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponto -d ponto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PONTO_TEST_PG: jdbc:postgresql://127.0.0.1:5432/ponto_test?user=ponto&password=ponto
      PGPASSWORD: ponto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y zsh postgresql-client
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: mvn -B verify
      - run: ./test/smoke.sh
      - run: python3 -m unittest discover -s test -p test_backup.py
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
