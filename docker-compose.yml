services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:e234321fd3abff7fb968b0674056e883b702aa1ad93a0d4d795cb6c21fa46407
    container_name: ponto-minio
    restart: unless-stopped
    user: "0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${PONTO_S3_ACCESS:?Configure PONTO_S3_ACCESS in .env}
      MINIO_ROOT_PASSWORD: ${PONTO_S3_SECRET:?Configure PONTO_S3_SECRET in .env}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - ${PONTO_OBJECT_DIR:-/home/thiagohmm/.local/share/ponto-minio}:/data

  ponto:
    build: .
    image: ponto:web
    container_name: ponto
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "${PONTO_BIND:-0.0.0.0}:${PONTO_PORT:-8090}:8080"
    environment:
      PONTO_DB: /data/ponto.db
      PONTO_TZ: ${PONTO_TZ:-America/Sao_Paulo}
      TZ: ${PONTO_TZ:-America/Sao_Paulo}
      PONTO_S3_ENDPOINT: http://minio:9000
      PONTO_S3_ACCESS: ${PONTO_S3_ACCESS:?Configure PONTO_S3_ACCESS in .env}
      PONTO_S3_SECRET: ${PONTO_S3_SECRET:?Configure PONTO_S3_SECRET in .env}
      PONTO_S3_BUCKET: ${PONTO_S3_BUCKET:-ponto}
      PONTO_UPLOAD_MIB: ${PONTO_UPLOAD_MIB:-20}
      PONTO_WEB_USER: ${PONTO_WEB_USER:?Configure PONTO_WEB_USER in .env}
      PONTO_WEB_PASSWORD: ${PONTO_WEB_PASSWORD:?Configure PONTO_WEB_PASSWORD in .env}
    volumes:
      - ${PONTO_DATA_DIR:-/home/thiagohmm/.local/share/ponto}:/data
    command: ["--serve", "--port=8080"]
    healthcheck:
      test: ["CMD", "java", "-cp", "/app/ponto.jar", "ponto.HealthCheck"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3
    stop_grace_period: 45s

  # Local TLS for PiTunnel --https (public cert is issued by PiTunnel).
  edge:
    image: caddy:2.10.2-alpine
    container_name: ponto-edge
    restart: unless-stopped
    depends_on:
      - ponto
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${PONTO_EDGE_DIR:-/home/thiagohmm/.local/share/ponto-edge}/certs:/certs:ro
