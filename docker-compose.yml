services:
  # S3-compatible object storage for the note attachments.
  # MinIO stopped publishing free container images (Oct/2025); SeaweedFS is
  # the drop-in S3 gateway in its place (SigV4, path-style, same API shape).
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: ponto-s3
    restart: unless-stopped
    command: ["server", "-dir", "/data", "-s3"]
    ports:
      - "8333:8333"   # S3 API
      - "8091:8080"   # web UI (browse / download)
    volumes:
      - /home/thiagohmm/.local/share/ponto-s3:/data

  ponto:
    build: .
    image: ponto:web
    container_name: ponto
    restart: unless-stopped
    depends_on:
      - s3
    ports:
      - "8090:8080"
    environment:
      PONTO_DB: /data/ponto.db
      PONTO_S3_ENDPOINT: http://s3:8333
      PONTO_S3_BUCKET: ponto
    volumes:
      - /home/thiagohmm/.local/share/ponto:/data
    command: ["--serve", "--port=8080"]
